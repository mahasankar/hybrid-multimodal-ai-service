# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=fraud-orchestrator-service

# Multipart Upload Guardrails
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# ML Scoring Microservice Endpoint (Defaults to localhost:8000, overridable via environment variable)
ml.scoring.base-url=${ML_SCORING_URL:http://localhost:8000}

# OCR Extraction Microservice Endpoint (Defaults to localhost:8001, overridable via environment variable)
ocr.extraction.base-url=${OCR_EXTRACTION_URL:http://localhost:8001}

# Speech Transcription Microservice Endpoint (Defaults to localhost:8002, overridable via environment variable)
speech.transcription.base-url=${SPEECH_TRANSCRIPTION_URL:http://localhost:8002}